# Builds the MC Rusted APK on GitHub, attaches it to the run, and publishes
# it in the Releases tab. Start it by hand: Actions tab > Build APK > Run workflow.
name: Build APK
on:
  workflow_dispatch:
    inputs:
      abi:
        description: Phone CPU type (arm64-v8a fits almost every modern phone)
        type: choice
        default: arm64-v8a
        options: [arm64-v8a, x86_64, armeabi-v7a, x86]
      release:
        description: Publish the APK in the Releases tab
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HORIZON_TELEMETRY_URL: "off"
      CARGO_TARGET_DIR: .local/ci-target
      ABI: ${{ inputs.abi }}
      # Optional: your own signing key.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Pick the Rust target for the chosen CPU type
        run: |
          case "$ABI" in
            arm64-v8a)   echo "TARGET=aarch64-linux-android" >> "$GITHUB_ENV" ;;
            armeabi-v7a) echo "TARGET=armv7-linux-androideabi" >> "$GITHUB_ENV" ;;
            x86)         echo "TARGET=i686-linux-android" >> "$GITHUB_ENV" ;;
            x86_64)      echo "TARGET=x86_64-linux-android" >> "$GITHUB_ENV" ;;
          esac

      - name: Install Android SDK parts
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKM" ]; then
            # Not on this runner image: fetch Google's command-line tools.
            curl -fsSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"

      - name: Install Rust target
        run: rustup target add "$TARGET"

      - name: Install Gradle 8.14
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "GRADLE_BIN=$RUNNER_TEMP/gradle-8.14/bin/gradle" >> "$GITHUB_ENV"

      - name: Cache Rust downloads and build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: apk-cargo-${{ inputs.abi }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: apk-cargo-${{ inputs.abi }}-

      # One signing key across runs, so each build can update the last.
      - name: Restore the signing key from cache
        if: env.KEYSTORE_B64 == ''
        uses: actions/cache@v4
        with:
          path: .local/android/debug.keystore
          key: apk-signing-key-v1

      - name: Use the signing key from the secret
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p .local/android
          echo "$KEYSTORE_B64" | base64 -d > .local/android/debug.keystore

      - name: Prepare engine tables (downloads from Mojang, takes a while)
        run: python3 tools/android_prepare.py

      - name: Build the APK
        run: >
          python3 tools/android_build.py
          --abi "$ABI" --public
          --sdk "$ANDROID_HOME"
          --java-home "$JAVA_HOME_17_X64"
          --gradle "$GRADLE_BIN"

      - name: Show the signing fingerprint
        run: |
          "$JAVA_HOME_17_X64/bin/keytool" -list -keystore .local/android/debug.keystore -storepass android | tail -n 2

      - name: Name the APK after the version
        run: |
          VERSION="$(grep -oP "versionName '\K[^']+" packaging/android/build.gradle)"
          APK="MC-Rusted-$VERSION-$ABI.apk"
          cp ".local/android/apk/$ABI/horizon-android-public.apk" "$APK"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: MC-Rusted-${{ inputs.abi }}
          path: ${{ env.APK }}
          retention-days: 14
          if-no-files-found: error

      - name: Publish a release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Same version already released (for example another CPU type): add the file.
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MC Rusted $VERSION" \
              --notes "MC Rusted $VERSION for Android ($ABI). Download the APK below and open it to install. Needs Android 9 or newer."
          fi
